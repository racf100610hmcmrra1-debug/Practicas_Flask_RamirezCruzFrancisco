<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área del Rectángulo</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}" />
</head>

<body>

    <header class="encabezado">

        <h1>Calcula el área con Flask</h1>

        <nav class="menu">
            <a href="{{ url_for('rectangulo_area') }}">Área</a>
            <a href="{{ url_for('rectangulo_perimetro') }}">Perímetro</a>
        </nav>

    </header>

    <main class="contenedor">

        <section class="tarjeta-operacion">

            <h2>Área del Rectángulo</h2>

            <form method="POST" action="{{ url_for('rectangulo_area') }}">

                <label for="base">Base</label>
                <input id="base" name="base" type="number" step="any" required />

                <label for="altura">Altura</label>
                <input id="altura" name="altura" type="number" step="any" required />

                <button class="boton" type="submit">
                    Calcular área
                </button>

            </form>

            {% if resultado is not none %}
                <p class="resultado">
                    Resultado: {{ resultado }}
                </p>
            {% endif %}

            {% if error %}
                <p class="error">
                    {{ error }}
                </p>
            {% endif %}

        </section>

    </main>

</body>
</html>
